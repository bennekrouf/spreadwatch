<?xml version="1.0" encoding="UTF-8"?>
<!--
  Spreadwatch app icon.
  Same family as the ais-* icons: the squircle and the white mark are the
  family, the hue and the glyph identify the app. Green is the app's accent
  (#3ecf8e in main.css) held a few steps darker so the white mark keeps its
  contrast. The glyph is two price lines, one per venue, with a bracket
  measuring the gap between them: the spread. Designed at 1024 to read at 16.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2FBF86"/>
      <stop offset="55%" stop-color="#16875E"/>
      <stop offset="100%" stop-color="#0B4A36"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9F7EA"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background (macOS-style continuous corner) -->
  <rect x="64" y="64" width="896" height="896" rx="224" ry="224" fill="url(#bg)"/>

  <g filter="url(#glow)" fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper venue: the ask side, a little ahead -->
    <polyline stroke-width="64" points="220,468 360,388 480,432 640,296"/>
    <!-- Lower venue: the same move, lagging and lower -->
    <polyline stroke-width="64" points="220,716 360,636 480,680 640,544"/>
  </g>

  <!-- The spread: a bracket measuring the gap at the right edge -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <line x1="770" y1="296" x2="770" y2="544"/>
    <line x1="730" y1="296" x2="810" y2="296"/>
    <line x1="730" y1="544" x2="810" y2="544"/>
  </g>
</svg>
