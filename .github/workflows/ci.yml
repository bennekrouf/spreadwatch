name: CI

# Fast feedback on every pull request and on main.
#
# release.yml is the heavy pipeline: it only runs on `v*` tags and produces
# signed macOS/Windows/Linux artifacts. This workflow exists so a regression
# `cargo test` can already see never costs that round trip.
on:
  pull_request:
  push:
    branches: [main]

# A newer push on the same ref cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Formatting: blocking ───────────────────────────────────────────────────
  # No compile, reports in ~20s. .githooks/pre-commit keeps the tree clean, so
  # this is a real gate rather than a check that is red forever.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── Tests + clippy: blocking, on all three platforms ───────────────────────
  # The release builds for macOS, Windows and Linux; testing on one would
  # leave the other two to be found out at release time. Windows matters most:
  # the hot wallet's file protection has its own code path there.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Dioxus desktop links GTK/WebKit even for unit tests; libssl-dev is
      # for native-tls, which uses OpenSSL on Linux.
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      # --locked fails the run if Cargo.lock has drifted from Cargo.toml.
      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
